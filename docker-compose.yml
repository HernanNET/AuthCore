services:
  postgres:
    image: postgres:16-alpine
    container_name: authcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: authcore
      POSTGRES_PASSWORD: authcore_dev
      POSTGRES_DB: authcore_dev
    ports:
      - "5432:5432"
    volumes:
      - authcore-pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authcore -d authcore_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  authcore-pgdata:
